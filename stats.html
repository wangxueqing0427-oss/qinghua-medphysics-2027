<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;opacity:.8}

.notice{padding:14px;margin-bottom:12px}.card{margin:10px 0;overflow:hidden}
.card button{width:100%;text-align:left;border:0;background:#fff;padding:16px;font-size:16px;font-weight:700}

.content h3{font-size:15px;margin:14px 0 7px}.content ul{padding-left:20px}

<body>
<header><h1>📊 353 卫生统计学精华库 V1</h1><div class="sub">清华医学物理与健康｜手机背诵版</div></header>
<main>
<div class="notice"><b>核心目标：会判断、会解释、会计算。</b><div class="small">先掌握“题目给什么数据→研究什么问题→选什么方法”，再记公式。内容为原创考试摘要，不替代教材原文。</div><div id="progress" class="small"></div></div>
<div id="cards"></div>
</main>
<script>
const data=[
["01","统计学基本概念",["总体/样本、参数/统计量、变量与数据类型"],`
<h3>必须掌握</h3><ul><li><b>总体</b>：研究对象的全体；<b>样本</b>：从总体抽取的一部分。</li><li><b>参数</b>描述总体；<b>统计量</b>由样本计算，用于推断总体。</li><li>变量可按性质分为定量、定性；定量数据又可分离散型和连续型。</li><li>分类资料常见二分类、多分类；有序分类还具有等级顺序。</li></ul><h3>背诵句</h3><p>“总体定范围，样本取一部分；参数说总体，统计量来自样本。”</p>`],
["02","描述统计",["频数、集中趋势、离散趋势、图表"],`
<h3>集中趋势</h3><ul><li><b>均数</b>：适合分布较对称的定量资料；极端值会明显影响。</li><li><b>中位数</b>：排序后的中间位置，偏态分布或极端值较多时更稳健。</li><li><b>众数</b>：出现次数最多的值，分类资料也可使用。</li></ul>
<h3>离散趋势</h3><ul><li>极差、四分位数间距、方差、标准差、变异系数。</li><li>标准差越大，数据围绕均数的离散程度通常越大。</li></ul>
<h3>图表</h3><p>分类资料常用条图/饼图；连续资料可用直方图、箱线图等。看图时先确认横纵轴和数据类型。</p>`],
["03","概率与随机变量分布",["概率、二项分布、正态分布、标准正态"],`
<h3>核心</h3><ul><li>概率衡量事件发生的可能性，范围在0到1。</li><li><b>二项分布</b>：固定次数、每次只有两种互斥结果且成功概率稳定的重复试验。</li><li><b>正态分布</b>：钟形、左右对称；均数、中位数、众数在理想正态分布中相同。</li></ul>
<h3>标准化</h3><div class="formula">Z = (X − μ) / σ</div><p>标准化后均值为0、标准差为1，用于比较不同量纲或不同尺度的位置。</p>`],
["04","抽样与抽样误差",["随机抽样、代表性、标准误"],`
<h3>常见抽样</h3><ul><li>简单随机、系统、分层、整群等。不同设计适用场景不同。</li><li><b>分层</b>：先按重要特征分层，再各层抽样；可保证各层代表性。</li><li><b>整群</b>：以群为单位抽取，组织方便，但群内相似性可能增大抽样误差。</li></ul>
<h3>抽样误差</h3><p>样本与总体之间因随机抽样产生的差异。样本量增大时，标准误通常下降。</p>
<h3>易错</h3><p>随机抽样解决代表性问题的一部分；它不能自动消除所有偏倚。</p>`],
["05","参数估计",["点估计、区间估计、置信区间"],`
<h3>点估计</h3><p>用样本统计量估计总体参数，例如用样本均数估计总体均数。</p>
<h3>区间估计</h3><p>给出一个可能包含总体参数的区间，并附带置信水平。</p>
<h3>置信区间怎么解释</h3><p>95%置信区间是基于重复抽样方法形成的区间估计程序；不要简单理解为“这一次参数有95%概率落在区间内”。</p>
<h3>精度</h3><p>其他条件相同时，样本量更大通常使区间更窄、估计更精确。</p>`],
["06","假设检验与P值",["H0/H1、α、P值、两类错误"],`
<h3>基本流程</h3><ol><li>提出无效假设H0和备择假设H1。</li><li>选择检验方法与显著性水平α。</li><li>计算统计量和P值。</li><li>结合P值、效应大小和置信区间作结论。</li></ol>
<h3>P值</h3><p>在H0成立及模型条件满足时，得到当前或更极端数据的概率度量。P小于预设α时，通常拒绝H0。</p>
<h3>两类错误</h3><ul><li>I类错误：H0真实却拒绝H0，概率通常控制在α附近。</li><li>II类错误：H0不真实却未拒绝H0。</li></ul>
<div class="warn">“P&gt;0.05”不等于“证明没有差异”；它表示现有证据不足以拒绝H0。</div>`],
["07","t检验",["单样本、两独立样本、配对资料"],`
<h3>什么时候想到t检验</h3><p>核心关键词是“比较均数”。常用于近似正态的定量资料，在相应条件下比较一个或两个均数。</p>
<ul><li><b>单样本t检验</b>：样本均数与已知/假定总体均数比较。</li><li><b>两独立样本t检验</b>：两个互不相关组的均数比较。</li><li><b>配对t检验</b>：同一对象前后测量，或天然成对对象的差值均数比较。</li></ul>
<h3>易错</h3><p>“前后”不等于一定用独立样本；同一人的前后数据通常属于配对资料。</p>`],
["08","χ²检验",["分类资料、四格表、独立性与趋势"],`
<h3>核心</h3><p>看到“率/构成比/分类结局之间是否有关联”，首先考虑χ²类方法，但最终要结合资料结构和频数条件。</p>
<h3>2×2表</h3><p>先排成“暴露/分组 × 结局”，再判断是否检验独立性；若理论频数太小，可能需要精确概率法或其他适当处理。</p>
<h3>背诵</h3><p>“定性资料看比例，两个分类变量的关联常想到χ²。”</p>`],
["09","方差分析",["多个均数比较、F统计量、多重比较"],`
<h3>什么时候用</h3><p>一个分类因素有三个或更多组，结局为定量资料，研究不同组总体均数是否存在差异时，常用方差分析。</p>
<h3>F检验思想</h3><p>比较“组间变异”与“组内变异”。如果组间差异相对组内波动足够大，F统计量会较大。</p>
<h3>重要</h3><p>总体F检验显著，只说明至少有一组均数不同；若要知道具体哪两组不同，需要进一步比较，并注意多重比较问题。</p>`],
["10","相关分析",["Pearson相关、方向、强度、相关≠因果"],`
<h3>核心</h3><p>相关分析描述两个定量变量之间线性关联的方向和程度。</p>
<ul><li>相关系数通常介于−1和+1。</li><li>正值表示同向，负值表示反向；绝对值越接近1，线性相关越强。</li><li>接近0只说明线性相关弱，不一定意味着完全没有任何关系。</li></ul>
<div class="warn"><b>相关不等于因果。</b>混杂因素、反向因果和偏倚都可能影响观察到的相关。</div>`],
["11","回归分析",["线性回归、Logistic回归、多变量调整"],`
<h3>线性回归</h3><p>结局为连续型定量变量时，常用线性回归研究一个或多个自变量与结局的关系，并可进行多变量调整。</p>
<h3>Logistic回归</h3><p>二分类结局时常用Logistic回归，可估计调整混杂因素后的优势比（OR）等效应指标。</p>
<h3>为什么要多变量</h3><p>同时纳入多个相关因素，可以在模型框架下调整潜在混杂，并估计各变量的独立关联，但不能自动保证因果关系。</p>`],
["12","统计方法选择总表",["考场决策树、资料类型、比较目的"],`
<h3>考场第一问：结局是什么？</h3>
<ul><li><b>连续定量</b>：比较两组均数 → 独立/配对t检验；三组以上 → 方差分析（满足条件时）。</li><li><b>分类资料</b>：比较率/构成比或检验分类变量关联 → χ²类方法；小样本频数条件不满足时考虑其他方法。</li><li><b>两个定量变量关系</b> → 相关分析；若要建立预测/调整模型 → 回归。</li></ul>
<h3>再问：独立还是配对？</h3><p>两组来自不同人群 → 独立；同一人前后或成对匹配 → 配对。</p>
<h3>最后问：研究目的</h3><p>“描述”用描述统计；“估计总体”用参数估计；“判断证据”用假设检验；“研究关联/调整因素”用相关或回归。</p>
<h3>一句话</h3><p><b>“先看变量类型，再看组数与是否配对，最后看研究目的。”</b></p>`]
];

const done=JSON.parse(localStorage.getItem('statsDone')||'{}');
const fav=JSON.parse(localStorage.getItem('statsFav')||'{}');
const cards=document.getElementById('cards');
function render(){
 cards.innerHTML='';
 data.forEach((x,i)=>{
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<button onclick="toggle(${i})"><span class="star ${fav[i]?'on':''}" onclick="event.stopPropagation();favorite(${i})">★</span>${x[0]}｜${x[1]}<div class="small">${x[2].join(' · ')}</div></button><div class="content" id="c${i}">${x[3]}<label class="small"><input type="checkbox" ${done[i]?'checked':''} onchange="finish(${i},this.checked)"> 我已能闭卷复述本章核心</label></div>`;
  cards.appendChild(d);
 });
 update();
}
function toggle(i){let e=document.getElementById('c'+i);e.style.display=e.style.display==='block'?'none':'block'}
function finish(i,v){done[i]=v;localStorage.setItem('statsDone',JSON.stringify(done));update()}
function favorite(i){fav[i]=!fav[i];localStorage.setItem('statsFav',JSON.stringify(fav));render()}
function update(){let n=Object.values(done).filter(Boolean).length;document.getElementById('progress').textContent=`完成进度：${n}/12 模块 · 收藏：${Object.values(fav).filter(Boolean).length} 模块`}
render();
</script>
</body></html>
