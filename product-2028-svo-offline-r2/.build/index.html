<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2430"><title>清华2028三科闭环试验</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"><style>textarea,input,select{font:inherit;font-size:1rem;width:100%;box-sizing:border-box;padding:12px}textarea{min-height:130px}.choice{display:block;padding:12px;border:1px solid #ddd;margin:8px 0}.choice input{width:auto}.wrap{padding-bottom:50px}button{min-height:44px}.status{padding:12px;background:#fff0cf}#message{white-space:pre-wrap}p{line-height:1.6}button:focus-visible,a:focus-visible{outline:3px solid #b45309}fieldset{border:0;padding:0}</style></head><body><div class="status">2028首课试运行 MOBILE-C1-SVO｜内部来源核查，非全考纲审核版。仅本机档案，无登录认证；共享设备不能保证隐私。</div><section hidden id="offline-status" class="status" role="status" aria-live="polite" data-state="preparing"><span id="offline-text">正在确认离线准备状态，请保持联网。</span> <button id="offline-retry" type="button">重试离线准备</button></section><section id="offline-health" class="status" role="status" aria-live="polite" data-state="preparing"><span id="offline-health-text">正在检查离线准备（R2），25秒内给出结果。</span><button id="offline-health-retry" type="button">重试离线准备</button><details><summary>离线诊断</summary><p id="offline-health-details"></p></details></section><script>// Standalone HTML bootstrap: no lesson, profile, IndexedDB or external script dependency.
(()=>{'use strict';const box=document.getElementById('offline-health'),text=document.getElementById('offline-health-text'),details=document.getElementById('offline-health-details'),button=document.getElementById('offline-health-retry');let serial=0,busy=false,phase='启动',reg;
function bounded(p,label,ms=6000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error(label+'超时（'+ms/1000+'秒）')),ms);Promise.resolve(p).then(v=>{clearTimeout(timer);resolve(v);},e=>{clearTimeout(timer);reject(e);});});}
function diagnostic(){return 'R2 · 阶段：'+phase+' · 控制器：'+(navigator.serviceWorker?.controller?.state||'无')+' · 安装：'+(reg?.installing?.state||'无')+' · 等待：'+(reg?.waiting?.state||'无')+' · 激活：'+(reg?.active?.state||'无');}
function show(state,value){box.dataset.state=state;text.textContent=value;details.textContent=diagnostic();}
function message(worker,type){return new Promise((resolve,reject)=>{const c=new MessageChannel(),timer=setTimeout(()=>done(Error('离线程序消息响应超时（4秒）')),4000);function done(err,data){clearTimeout(timer);c.port1.close();err?reject(err):resolve(data);}c.port1.onmessage=e=>done(null,e.data);c.port1.onmessageerror=()=>done(Error('离线程序消息无法解码'));c.port1.start();try{worker.postMessage({type},[c.port2]);}catch(e){done(e);}});}
function waitControl(){return new Promise((resolve,reject)=>{const start=Date.now(),timer=setInterval(()=>{if(navigator.serviceWorker.controller&&reg.active){clearInterval(timer);resolve(navigator.serviceWorker.controller);}else if(reg.installing?.state==='redundant'||Date.now()-start>8000){clearInterval(timer);reject(Error('离线程序安装或页面接管超时（8秒）'));}},100);});}
async function run(user=false){if(busy)return;busy=true;const id=++serial;button.disabled=true;let timer=setTimeout(()=>{if(id!==serial)return;serial++;busy=false;button.disabled=false;show('failed','离线准备总超时（25秒）。学习记录未清除；保持联网后重试。');},25000);function current(){if(id!==serial)throw Error('本次检查已结束');}function step(value){current();phase=value;show('preparing','正在检查：'+value+'。请保持联网；25秒内给出结果。');}
try{step('检查浏览器能力');if(!isSecureContext||!('serviceWorker'in navigator))throw Error('当前浏览器不支持安全离线程序');navigator.serviceWorker.startMessages?.();step('查询注册');reg=await bounded(navigator.serviceWorker.getRegistration('./'),'查询离线注册');current();if(!reg||(!reg.active&&!reg.waiting&&!reg.installing)){step('注册离线程序');reg=await bounded(navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}),'注册离线程序');}current();if(user){step('检查程序更新');await bounded(reg.update(),'检查程序更新');current();await bounded(new Promise(resolve=>{if(!reg.installing)return resolve();const worker=reg.installing;worker.addEventListener('statechange',()=>{if(['installed','activated','redundant'].includes(worker.state))resolve();});}),'等待下载更新',9000);current();if(reg.waiting){step('接管新离线程序');reg.waiting.postMessage({type:'ACTIVATE_UPDATE'});await bounded(new Promise(resolve=>{if(!reg.waiting)return resolve();navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true});}),'激活新离线程序',8000);}}step('等待页面控制器');const worker=await waitControl();current();step('核对完整缓存');let status=await message(worker,'OFFLINE_STATUS');current();if(status.version!=='svo-offline-r2')throw Error('当前仍是旧离线程序，请联网点击重试以安装R2');if(!status.ready&&navigator.onLine){step('补齐离线文件');status=await message(worker,'REPAIR_OFFLINE');current();}if(!status.ready)throw Error(status.error||'缓存不完整，缺少 '+(status.missing||[]).length+' 项');phase='完成';show('ready',navigator.onLine?'离线已就绪：本课缓存完整（R2）。':'已离线：本课缓存完整（R2）。');}catch(e){if(id===serial)show('failed','离线尚未就绪：'+e.message+'。可以继续在线学习；学习记录未清除。');}finally{clearTimeout(timer);if(id===serial){busy=false;button.disabled=false;}}}
button.addEventListener('click',()=>run(true));window.addEventListener('pageshow',()=>{if(!busy)run();});navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(!busy)run();});run();})();
</script><main class="wrap"><div id="message" role="status" aria-live="polite"></div><div id="app"></div></main><script src="course-engine.js"></script><script src="profile-repository.js"></script><script src="learning-controller.js"></script><script src="pilot-ui.js"></script></body></html>
