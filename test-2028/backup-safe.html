<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原始记录备份</title><link rel="stylesheet" href="css/app.css?v=600"></head>
<body><main class="wrap"><section class="card"><h1>原始记录备份</h1><p>仅从当前入口所在的浏览器读取记录，不恢复、不修改、不重置。Safari与主屏幕APP若使用不同存储，请从平常学习的同一入口操作。</p><p>此工具保留原始进度、资料文字和笔记。PDF附件逐份导出，避免手机一次处理过大的文件。</p><button class="btn block" id="export">导出原始记录</button><p id="status" role="status"></p><label>检查刚导出的文件（不会恢复）<input id="check" type="file" accept=".json,application/json"></label><p id="verified" role="status"></p></section><section class="card"><h2>PDF附件</h2><button class="btn ghost" id="list">查看本地附件</button><div id="pdfs"></div></section></main><script src="js/backup60.js?v=600"></script><script>
const status=document.getElementById('status');
document.getElementById('export').onclick=async()=>{status.textContent='正在只读导出…';try{const p=await Backup60.exportSnapshot();status.textContent='文件已生成：资料 '+p.data.documents.length+'份、笔记 '+p.data.notes.length+'条。请存储到“文件”，再用下方按钮校验；另有 '+p.data.pdfAttachments.length+'份PDF需单独保存。';}catch(e){status.textContent=e.message;}};
document.getElementById('check').onchange=async e=>{const out=document.getElementById('verified');try{const p=JSON.parse(await e.target.files[0].text()),r=await Backup60.validate(p);out.textContent='文件校验通过；章节记录 '+r.chapters+'、错题 '+r.wrong+'、资料 '+r.documents+'、笔记 '+r.notes+(r.parseError?'。原进度格式异常，但原始内容已保留；请勿恢复或清理。':'。仅检查，没有恢复任何记录。');}catch(error){out.textContent='校验未通过：'+error.message;}};
document.getElementById('list').onclick=async()=>{const box=document.getElementById('pdfs');box.textContent='读取中…';try{const rows=await Backup60.pdfs();box.textContent=rows.length?'':'本入口没有关联PDF附件。';for(const row of rows){const b=document.createElement('button');b.className='btn ghost block';b.textContent='保存 '+(row.blob?.name||row.id+'.pdf');b.onclick=()=>Backup60.exportPdf(row);box.appendChild(b);}}catch(e){box.textContent=e.message;}};
</script></body></html>
