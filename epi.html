<body>
<header><h1>📚 353 流行病学精华库 V1</h1><div class="sub">清华医学物理与健康｜手机背诵版</div></header>
<main>
<div class="notice">
<b>使用规则</b>
<div class="small">每天只学 1–2 个卡片；先看“必须掌握”，再闭眼复述。内容按清华2026官方353大纲重构为原创考点摘要，不替代教材原文。</div>
<div class="progress" id="progress"></div>
</div>
<div id="cards"></div>
</main>
<script>
const data = [
["01","流行病学绪论",["定义、研究对象、方法与用途"],`
<h3>一、必须掌握</h3>
<ul>
<li><b>流行病学：</b>研究人群中健康状态及疾病的分布、影响因素，并利用研究结果促进健康、预防和控制疾病。</li>
<li><b>研究对象：</b>人群，不是单个患者；核心视角是“群体 + 分布 + 因素 + 干预”。</li>
<li><b>观察性研究：</b>研究者不主动分配暴露或干预，常见现况、病例对照、队列。</li>
<li><b>实验性研究：</b>研究者主动施加干预并观察结果，随机对照试验是典型形式。</li>
</ul>
<h3>二、考试最爱问</h3>
<ul><li>“描述分布”→描述性研究；“找原因/危险因素”→分析性研究；“评价干预效果”→实验研究。</li>
<li>看到题干先问自己：<b>研究对象是谁？暴露有没有人为分配？时间方向是什么？</b></li></ul>
<h3>三、一句话背诵</h3><p>“流行病学研究人群中的健康与疾病：看分布、找因素、评干预、服务防控。”</p>`],
["02","疾病的分布",["率、比、发病/死亡指标、三间分布、流行强度"],`
<h3>一、必须掌握</h3>
<ul><li><b>率：</b>表示某事件发生的频率，分子属于分母所代表的人群。</li>
<li><b>比：</b>两个有联系但不要求包含关系的量进行比较。</li>
<li><b>发病率：</b>一定期间新发生病例数 ÷ 同期有患病风险的人群。</li>
<li><b>患病率：</b>某时点或期间现患病例数 ÷ 相应人口；受发病率和病程共同影响。</li>
<li><b>病死率：</b>某病患者中因该病死亡的比例，反映疾病严重程度。</li></ul>
<h3>二、三间分布</h3>
<ul><li>地区：国家、地区、城乡、自然环境等。</li><li>时间：短期波动、季节性、周期性、长期趋势。</li><li>人群：年龄、性别、职业、行为等。</li></ul>
<h3>三、流行强度</h3><p>散发 → 流行 → 暴发/大流行等，具体判断依疾病背景和时间空间聚集程度。</p>
<h3>四、易混点</h3><p>发病率强调“新发生”；患病率强调“现有病例”。病程越长，在其他条件相近时患病率通常越高。</p>`],
["03","病因与病因推断",["病因、关联与因果、因果推断"],`
<h3>一、核心框架</h3>
<ul><li><b>关联：</b>暴露与结局存在统计学联系；不等于因果。</li>
<li><b>因果关系：</b>暴露的改变能够导致结局风险发生系统性改变。</li>
<li>混杂、偏倚和随机误差都可能制造或扭曲观察到的关联。</li></ul>
<h3>二、做题三问</h3>
<ol><li>有没有真实关联？</li><li>关联是否可能来自偏倚或混杂？</li><li>排除替代解释后，是否有足够证据支持因果？</li></ol>
<h3>三、记忆</h3><p>“先看关联，再排偏倚；控制混杂，结合证据；最后讨论因果。”</p>`],
["04","描述性研究",["现况研究、普查、抽样调查、偏倚、生态学研究"],`
<h3>一、现况研究</h3>
<ul><li>在某一时间点或较短时期内同时测量暴露和结局，像给人群“拍一张照片”。</li><li>适合描述患病水平、发现线索、进行卫生服务规划。</li><li>主要局限：暴露与结局时间先后常难判断，因此因果推断能力有限。</li></ul>
<h3>二、普查 vs 抽样调查</h3>
<ul><li><b>普查：</b>调查目标人群全部对象；信息较全面，但成本高、组织难。</li><li><b>抽样：</b>从总体抽取样本推断总体；关键是代表性和随机性。</li></ul>
<h3>三、偏倚</h3><p>常见包括选择偏倚、信息偏倚；控制思路是优化抽样、测量、调查流程并进行设计/分析控制。</p>
<h3>四、生态学研究</h3><p>以群体而非个体为分析单位；适合产生假设，但容易出现生态学谬误。</p>`],
["05","病例对照研究",["病例/对照选择、OR、95%CI、偏倚"],`
<h3>一、核心</h3><p>先按结局选择病例和对照，再回顾比较既往暴露。适合研究罕见病或潜伏期长的疾病。</p>
<h3>二、最重要指标</h3><p><b>OR（优势比）</b>用于衡量病例组与对照组暴露优势的相对大小。在疾病罕见且设计条件合适时，OR可近似RR。</p>
<h3>三、95%CI</h3><ul><li>若OR的95%CI跨过1，通常提示统计学证据不足以拒绝“无关联”的假设。</li><li>区间越窄，估计通常越精确。</li></ul>
<h3>四、三大偏倚</h3><p>选择偏倚、信息偏倚、混杂偏倚。控制要贯穿设计、实施、分析全过程。</p>
<h3>五、背法</h3><p>“病例对照：先找病，再找过去的暴露；核心指标OR。”</p>`],
["06","队列研究",["RR、AR、ARP、PARP、SMR、随访"],`
<h3>一、核心</h3><p>先按暴露状态分组，再随访观察结局发生。时间方向通常是“暴露 → 结局”。</p>
<h3>二、必须会</h3>
<ul><li><b>RR：</b>暴露组风险 ÷ 非暴露组风险。</li>
<li><b>AR：</b>暴露组风险 − 非暴露组风险，表示暴露带来的绝对风险增加。</li>
<li><b>ARP：</b>归因危险度在人群暴露组风险中的比例。</li>
<li><b>PARP：</b>人群归因危险度占人群总风险的比例，反映消除暴露后理论上可减少的人群风险比例。</li>
<li><b>SMR：</b>实际死亡数 ÷ 按标准人口死亡率计算的预期死亡数 ×100%（具体题目按给定定义计算）。</li></ul>
<h3>三、优点</h3><p>可直接计算发病风险和RR，时间顺序较清楚；可研究一种暴露对应多个结局。</p>
<h3>四、背法</h3><p>“队列先暴露、后结局；RR看相对，AR看绝对。”</p>`],
["07","实验流行病学",["临床试验、随机、对照、盲法、效果评价"],`
<h3>一、基本原则</h3><ul><li>明确研究问题与结局指标。</li><li>合理选择对象。</li><li><b>随机化</b>减少组间系统差异。</li><li><b>对照</b>提供比较基准。</li><li><b>盲法</b>减少测量和实施过程中的偏倚。</li></ul>
<h3>二、效果评价</h3><p>常见相对危险度、绝对危险度以及生存分析等。题目给出数据时，先画清“干预组/对照组 × 结局”。</p>
<h3>三、易错</h3><p>随机化不是“让结果随机”，而是让分组过程尽可能公平，从而控制已知和未知混杂因素。</p>`],
["08","筛检与诊断试验",["灵敏度、特异度、预测值、联合试验"],`
<h3>一、2×2表必须熟</h3>
<p>金标准阳性/阴性 × 检测阳性/阴性，先定位TP、FP、FN、TN，再计算指标。</p>
<h3>二、四个核心指标</h3>
<ul><li><b>灵敏度</b> = TP/(TP+FN)：真正有病的人中被检出的比例。</li>
<li><b>特异度</b> = TN/(TN+FP)：真正无病的人中被判阴性的比例。</li>
<li><b>阳性预测值</b> = TP/(TP+FP)：检测阳性者中真正有病的比例。</li>
<li><b>阴性预测值</b> = TN/(TN+FN)：检测阴性者中真正无病的比例。</li></ul>
<h3>三、最关键区别</h3><p>灵敏度、特异度主要与试验本身及判定标准相关；预测值会明显受到人群患病率影响。</p>
<h3>四、联合试验</h3><p>并联通常提高发现病例的能力；串联通常提高排除假阳性的能力。做题必须以题目定义和联合规则为准。</p>`],
["09","传染病流行病学",["传染源、传播途径、易感人群、暴发调查"],`
<h3>一、流行过程三环节</h3>
<ul><li><b>传染源：</b>病原体在其中生存、繁殖并可排出的人或动物。</li>
<li><b>传播途径：</b>病原体从传染源到达易感者的途径。</li>
<li><b>易感人群：</b>对某传染病缺乏特异性免疫、容易感染的人群。</li></ul>
<h3>二、控制思路</h3><p>控制传染源 + 切断传播途径 + 保护易感人群。</p>
<h3>三、暴发调查基本流程</h3><p>确认暴发 → 核实诊断 → 建立病例定义 → 主动发现病例 → 描述时间/地点/人群分布 → 提出假设 → 分析研究 → 实施控制措施 → 评估效果并总结。</p>`],
["10","疾病监测",["目的、系统评价、预警"],`
<h3>一、监测是什么</h3><p>持续、系统地收集、分析和解释健康相关数据，并及时反馈用于疾病防控和决策。</p>
<h3>二、为什么监测</h3><ul><li>发现异常变化和流行趋势。</li><li>识别高风险人群和地区。</li><li>评价防控措施效果。</li><li>支持预警和资源配置。</li></ul>
<h3>三、系统评价</h3><p>重点关注及时性、完整性、代表性、敏感性、可接受性等维度；具体题目按给定评价框架作答。</p>`],
["11","循证医学与Meta分析",["证据、系统评价、Meta分析基本理念"],`
<h3>一、循证医学</h3><p>将最佳可获得证据与临床/公共卫生专业判断及实际情境相结合，支持科学决策。</p>
<h3>二、系统评价</h3><p>围绕明确问题，按照预先设定的方法系统检索、筛选和评价研究，并综合证据。</p>
<h3>三、Meta分析</h3><p>用统计方法对多个相互独立但研究问题相近的研究结果进行定量综合，以获得总体效应估计，同时考察研究间异质性。</p>
<h3>四、背法</h3><p>“系统评价是证据综合的方法框架；Meta分析是其中可能采用的定量综合工具。”</p>`]
];

const cards=document.getElementById('cards');
const done=JSON.parse(localStorage.getItem('epiDone')||'{}');
const fav=JSON.parse(localStorage.getItem('epiFav')||'{}');

function render(){
  cards.innerHTML='';
  data.forEach((x,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<button onclick="toggle(${i})"><span class="star ${fav[i]?'on':''}" onclick="event.stopPropagation();favorite(${i})">★</span>${x[0]}｜${x[1]}<div class="small">${x[2].join(' · ')}</div></button><div class="content" id="c${i}">${x[3]}<label class="small"><input type="checkbox" ${done[i]?'checked':''} onchange="finish(${i},this.checked)"> 我已能闭卷复述本章核心</label></div>`;
    cards.appendChild(d);
  });
  update();
}
function toggle(i){const e=document.getElementById('c'+i);e.style.display=e.style.display==='block'?'none':'block'}
function finish(i,v){done[i]=v;localStorage.setItem('epiDone',JSON.stringify(done));update()}
function favorite(i){fav[i]=!fav[i];localStorage.setItem('epiFav',JSON.stringify(fav));render()}
function update(){const n=Object.values(done).filter(Boolean).length;document.getElementById('progress').textContent=`完成进度：${n}/11 章 · 收藏：${Object.values(fav).filter(Boolean).length} 章`}
render();
</script>
</body></html>
