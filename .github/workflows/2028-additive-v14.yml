name: V14 55-course STAT03 additive and data-safe mobile preview
on:
  push:
    branches:
      - candidate/2026-11-13-v14-anova-regression
    paths:
      - product-2028-anova-regression-foundation/**
      - product-2028-v14-additive/**
      - product-2028-integration-47-upgraded/build.cjs
      - .github/workflows/2028-additive-v14.yml
permissions:
  contents: read
jobs:
  verify:
    name: V14 55-course 620-question STAT03 and V13-to-V14 iPhone data safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA dependencies
        working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Rebuild all original and protected V2-V13 47-54-course products in order
        run: |
          node product-2028-integration-47/build.cjs
          node product-2028-integration-47-upgraded/build.cjs
          node product-2028-mobile-ux-v2/build.cjs
          node product-2028-mobile-reading-v3/build.cjs
          node product-2028-reading-v4/build.cjs
          node product-2028-diagnostic-v5/build.cjs
          node product-2028-screening-48/build.cjs
          node product-2028-radiation-49/build.cjs
          node product-2028-nuclear-50/build.cjs
          node product-2028-radiotherapy-51/build.cjs
          node product-2028-stat-inference-52/build.cjs
          node product-2028-progress-v11/build.cjs
          node product-2028-v12-additive/build.cjs
          node product-2028-v13-additive/build.cjs
      - name: Verify original course and prior V13 migration contracts still pass
        run: |
          node --test product-2028-assurance-v1/test.cjs
          node --test product-2028-v13-additive/test.cjs
          node --test product-2028-outbreak-foundation/test.cjs
      - name: Check 12 STAT03 problems and independently recompute four objective calculations
        run: node --test product-2028-anova-regression-foundation/test.cjs
      - name: Build V14 55 courses and 620 authored questions with full SHA-256 gate
        run: node product-2028-v14-additive/build.cjs
      - name: Ensure source curriculum, wrong edition, forged grades and new key changes fail closed
        run: node --test product-2028-v14-additive/test.cjs
      - name: Verify opt-in V13 to V14 migration and prerequisite learning on mobile Chromium and WebKit
        run: node product-2028-v14-additive/migration-browser.cjs
      - name: Archive only synthetic audit receipts, never release production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-stat03-55-synthetic-acceptance
          path: |
            product-2028-v14-additive/build-receipt.json
            product-2028-v14-additive/migration-browser-results.json
          if-no-files-found: warn
          retention-days: 14
