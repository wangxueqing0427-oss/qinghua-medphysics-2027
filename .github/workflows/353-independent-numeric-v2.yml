name: 353 independent numeric recomputation - 39 questions
on:
  push:
    branches:
      - candidate/2026-11-13-353-independent-numeric
    paths:
      - product-2028-assurance-v2/**
      - product-2028-assurance-v3/**
      - product-2028-assurance-v4/**
      - .github/workflows/353-independent-numeric-v2.yml
permissions:
  contents: read
jobs:
  formula:
    name: Recalculate 39 numerical questions without reading stored answers
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen 47-course baseline
        run: node product-2028-integration-47/build.cjs
      - name: Reconstruct SVO6 protected course version
        run: node product-2028-integration-47-upgraded/build.cjs
      - name: Rebuild isolated V2-V4 mobile presentation assets
        run: |
          node product-2028-mobile-ux-v2/build.cjs
          node product-2028-mobile-reading-v3/build.cjs
          node product-2028-reading-v4/build.cjs
      - name: Reconstruct original 47-course/524-question diagnostic content
        run: node product-2028-diagnostic-v5/build.cjs
      - name: Assert 524 question structural evidence baseline remains fail-closed
        run: node --test product-2028-assurance-v1/test.cjs
      - name: Recalculate every current 353 numerical question and reject tampering
        run: node --test product-2028-assurance-v2/test.cjs
      - name: Validate 165 qualitative questions and limited NIST concept crosschecks
        run: node --test product-2028-assurance-v3/test.cjs
      - name: Produce 39 item numerical proof and 165 question pending review queue
        run: node product-2028-assurance-v2/run.cjs
      - name: Produce prioritized 353 qualitative review packet
        run: node product-2028-assurance-v3/run.cjs
      - name: Check the 2027 official syllabus topic map without claiming 2028 coverage
        run: node --test product-2028-assurance-v4/test.cjs
      - name: Export no-fake-coverage 353 course-development roadmap
        run: node product-2028-assurance-v4/run.cjs
      - name: Archive immutable synthetic proof without any release/deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 353-independent-recomputation-39
          path: |
            product-2028-assurance-v2/results/353-numeric-recheck.json
            product-2028-assurance-v2/results/353-quality-next-queue.md
            product-2028-assurance-v3/results/353-qualitative-triage.json
            product-2028-assurance-v3/results/353-qualitative-165-review.md
            product-2028-assurance-v4/results/2027-outline-map.json
            product-2028-assurance-v4/results/2027-outline-development-plan.md
          if-no-files-found: warn
          retention-days: 14
