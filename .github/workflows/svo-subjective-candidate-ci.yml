name: SVO subjective isolated candidate
on:
  push:
    branches:
      - candidate/2026-11-11-svo-subjective
    paths:
      - product-2028-svo-subjective-candidate/**
      - .github/workflows/svo-subjective-candidate-ci.yml
permissions:
  contents: read
jobs:
  targeted:
    name: Isolated subjective and existing SVO regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned fake IndexedDB test dependency
        working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Targeted subjective state, delayed learning and data isolation
        run: node --test product-2028-svo-subjective-candidate/test.cjs
      - name: Rebuild prerequisite historic C1 assets locally in CI only
        run: node product-2028-mobile-candidate/build.cjs
      - name: Reuse existing frozen original SVO unit and storage regression
        run: node product-2028-svo-c1/test.cjs
      - name: Generate standalone R2-derived six-question candidate in isolated output
        run: node product-2028-svo-subjective-candidate/build.cjs
      - name: Test isolated mobile lesson, delayed review and offline reopen in Chromium and WebKit
        run: node product-2028-svo-subjective-candidate/browser.cjs
      - name: Retain candidate build and real browser evidence without deploying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svo-subjective-local-${{ github.sha }}
          path: |
            product-2028-svo-subjective-candidate/build-receipt.json
            product-2028-svo-subjective-candidate/browser-results.json
          if-no-files-found: warn
          retention-days: 7
