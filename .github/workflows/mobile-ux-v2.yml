name: Mobile UX V2 isolated core verification
on:
  push:
    branches:
      - candidate/2026-11-13-mobile-ux-v2
    paths:
      - product-2028-mobile-ux-v2/**
      - product-2028-integration-47-upgraded/build.cjs
      - .github/workflows/mobile-ux-v2.yml
permissions:
  contents: read
jobs:
  ux:
    name: Verify course directory, mobile touch and learner resume
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build old untouched 47-course baseline
        run: node product-2028-integration-47/build.cjs
      - name: Build previously verified 47-course SVO6 candidate
        run: node product-2028-integration-47-upgraded/build.cjs
      - name: Build isolated mobile UX V2 with new local database
        run: node product-2028-mobile-ux-v2/build.cjs
      - name: Test mobile UX on Chromium and WebKit
        run: node product-2028-mobile-ux-v2/browser.cjs
      - name: Archive synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-v2-smoke
          path: |
            product-2028-mobile-ux-v2/build-receipt.json
            product-2028-mobile-ux-v2/browser-results.json
          if-no-files-found: warn
          retention-days: 7
