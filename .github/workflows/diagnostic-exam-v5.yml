name: Isolated three-subject diagnostic V5
on:
  push:
    branches:
      - candidate/2026-11-13-diagnostic-exam-v5
    paths:
      - product-2028-diagnostic-v5/**
      - .github/workflows/diagnostic-exam-v5.yml
      - product-2028-integration-47-upgraded/build.cjs
permissions:
  contents: read
jobs:
  diagnostic:
    name: Verify nonofficial exam engine and iPhone-browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned test dependencies
        working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build existing frozen 47-course catalog
        run: node product-2028-integration-47/build.cjs
      - name: Build prior SVO6 candidate
        run: node product-2028-integration-47-upgraded/build.cjs
      - name: Build prior mobile UX V2
        run: node product-2028-mobile-ux-v2/build.cjs
      - name: Build prior mobile reading V3
        run: node product-2028-mobile-reading-v3/build.cjs
      - name: Build prior English full-passage V4
        run: node product-2028-reading-v4/build.cjs
      - name: Build isolated V5 without content drift
        run: node product-2028-diagnostic-v5/build.cjs
      - name: Check plan scope, time-limit, reference-only grading and tampering
        run: node --test product-2028-diagnostic-v5/test.cjs
      - name: Verify phone browser learning backup and mini exam on Chromium/WebKit
        run: node product-2028-diagnostic-v5/browser.cjs
      - name: Archive synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-mini-v5-evidence
          path: |
            product-2028-diagnostic-v5/build-receipt.json
            product-2028-diagnostic-v5/browser-results.json
          if-no-files-found: warn
          retention-days: 7
