name: English full-passage reading V4 isolated verification
on:
  push:
    branches:
      - candidate/2026-11-13-reading-fullpassage-v4
    paths:
      - product-2028-reading-v4/**
      - product-2028-integration-47-upgraded/build.cjs
      - .github/workflows/reading-fullpassage-v4.yml
permissions:
  contents: read
jobs:
  fullpassage:
    name: Verify 47-course content safety and English passage playback
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned Playwright and IndexedDB dependencies
        working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Rebuild original protected 47-course catalog
        run: node product-2028-integration-47/build.cjs
      - name: Rebuild SVO6 isolated catalog
        run: node product-2028-integration-47-upgraded/build.cjs
      - name: Rebuild mobile UX V2
        run: node product-2028-mobile-ux-v2/build.cjs
      - name: Rebuild reading V3
        run: node product-2028-mobile-reading-v3/build.cjs
      - name: Verify reading V3 has no regression in Chromium and WebKit
        run: node product-2028-mobile-reading-v3/browser.cjs
      - name: Build V4 while preserving all original questions
        run: node product-2028-reading-v4/build.cjs
      - name: Test full passages, distinct delayed review, native speech and data safety
        run: node product-2028-reading-v4/browser.cjs
      - name: Archive synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-v4-synthetic-proof
          path: |
            product-2028-reading-v4/build-receipt.json
            product-2028-reading-v4/browser-results.json
          if-no-files-found: warn
          retention-days: 7
