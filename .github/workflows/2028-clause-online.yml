name: Clause pinned HTTPS verification
on:
  push:
    branches: [candidate/2026-11-17-clause-continuation]
    paths: [product-2028-issue10-papers/extension/online.cjs, .github/workflows/2028-clause-online.yml]
permissions:
  contents: read
  checks: read
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: node product-2028-issue10-papers/extension/online.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clause-online-${{ github.sha }}
          path: product-2028-issue10-papers/extension/online-result.json
          retention-days: 7
