name: Isolated 2028 R5 browser and content tests
on:
  push:
    branches: [engineering/2028-r5]
    paths: [product-2028-pilot-build/**, product-2028-ci/**, product-2028-draft/content/**, product-2028-draft/course-engine.cjs, audit-2028/course-batch1-test.cjs, .github/workflows/2028-r5-e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-2028-r5
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product-2028-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node ../audit-2028/course-batch1-test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Record evidence without artifact storage
        if: always()
        run: node summarize.cjs
