name: Isolated 2028 R5 browser and content tests
on:
  push:
    branches: [engineering/2028-r5, audit/2026-10-21-four-gaps-v7]
    paths: [audit-2028/conditional-v9-test.cjs, product-2028-draft/mp-evidence-2026-10-23/**, audit-2028/four-gaps-v8-test.cjs, product-2028-draft/mp-evidence-2026-10-22/**, audit-2028/primary-pages-v6-test.cjs, audit-2028/run-internal-gate.cjs, audit-2028/nuclear-evidence-test.cjs, product-2028-draft/mp-evidence-2026-10-21/**, audit-2028/build-mp-evidence-v3.cjs, audit-2028/waves-evidence-test.cjs, product-2028-draft/mp-concept-review-v1/**, audit-2028/build-mp-concept-review.cjs, audit-2028/mp-concept-review-test.cjs, audit-2028/mp-foundation-test.cjs, product-2028-draft/syllabus-353-v2/**, audit-2028/build-353-remap.cjs, audit-2028/353-remap-test.cjs, audit-2028/quantity-measurement-test.cjs, expert-review-bundles/question-review-issues.json, audit-2028/build-expert-review-bundles.cjs, audit-2028/expert-bundle-test.cjs, audit-2028/foundation-batch-test.cjs, audit-2028/draft-course-loop.cjs, audit-2028/english-agreement-test.cjs, audit-2028/political-development-test.cjs, product-2028-draft/course-drafts/**, audit-2028/variable-types-test.cjs, product-2028-pilot-build/**, product-2028-ci/**, product-2028-draft/content/**, product-2028-draft/course-engine.cjs, audit-2028/course-batch1-test.cjs, audit-2028/batch2-content-test.cjs, audit-2028/review-ledger-test.cjs, audit-2028/catalog-integration-test.cjs, audit-2028/skill-workflow.cjs, audit-2028/skills-workflow-test.cjs, .agents/skills/**, .github/workflows/2028-r5-e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-2028-r5
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product-2028-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node ../audit-2028/course-batch1-test.cjs
      - run: node ../audit-2028/batch2-content-test.cjs
      - run: node ../audit-2028/review-ledger-test.cjs
      - name: Validate reusable skills workflows without granting expert approval
        working-directory: .
        run: node audit-2028/skills-workflow-test.cjs
      - name: Verify measurable objectives and preserve old answer evidence
        working-directory: .
        run: node audit-2028/objective-quality-test.cjs
      - name: Verify isolated variable-types draft without catalog publication
        working-directory: .
        run: node audit-2028/variable-types-test.cjs
      - name: Verify English agreement draft before political development
        working-directory: .
        run: node audit-2028/english-agreement-test.cjs
      - name: Verify political development draft without publication
        working-directory: .
        run: node audit-2028/political-development-test.cjs
      - name: Verify chained foundation drafts and immutable expert bundles
        working-directory: .
        run: |
          node audit-2028/foundation-batch-test.cjs
          node audit-2028/expert-bundle-test.cjs
      - name: Audit unified catalog without granting expert approval
        working-directory: .
        run: node audit-2028/audit-course-catalog.cjs
      - name: Verify full 353 source remap and isolated physical measurement course
        working-directory: .
        run: |
          node audit-2028/353-remap-test.cjs
          node audit-2028/quantity-measurement-test.cjs
          node audit-2028/mp-concept-review-test.cjs
          node audit-2028/mp-foundation-test.cjs
          node audit-2028/waves-evidence-test.cjs
          node audit-2028/nuclear-evidence-test.cjs
          node audit-2028/primary-pages-v6-test.cjs
          node audit-2028/four-gaps-v8-test.cjs
          node audit-2028/conditional-v9-test.cjs
      - name: Verify JSON-only updates invalidate cached course assets
        working-directory: .
        run: node audit-2028/data-only-update-test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Record evidence without artifact storage
        if: always()
        run: node summarize.cjs
