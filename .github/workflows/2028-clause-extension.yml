name: Scoped clause course continuation
on:
  push:
    branches: [candidate/2026-11-17-clause-continuation]
    paths: [product-2028-issue10-papers/extension/**, .github/workflows/2028-clause-extension.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PW_MODULE: ../../product-2028-ci/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: node product-2028-issue10-papers/extension/verify.cjs
      - run: node product-2028-issue10-papers/extension/clause-course-test.cjs
      - run: BROWSER=chromium node product-2028-issue10-papers/extension/browser.cjs
      - run: BROWSER=webkit node product-2028-issue10-papers/extension/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clause-continuation-${{ github.sha }}
          path: |
            product-2028-issue10-papers/extension/browser-*.json
            product-2028-issue10-papers/extension/failure-*.png
            product-2028-issue10-papers/extension/*receipt.json
          retention-days: 7
