name: 353 nuclear imaging foundation V8 isolated 50-course verification
on:
  push:
    branches:
      - candidate/2026-11-13-353-nuclear-imaging-v8
    paths:
      - product-2028-nuclear-imaging-foundation/**
      - product-2028-nuclear-50/**
      - product-2028-integration-47-upgraded/build.cjs
      - .github/workflows/353-nuclear50-v8.yml
permissions:
  contents: read
jobs:
  nuclear:
    name: 50-course PET/SPECT learning and diagnostic simulated iPhone tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing isolated browser test dependencies
        working-directory: product-2028-ci
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Rebuild frozen V5, V6, V7 in dependency order
        run: |
          node product-2028-integration-47/build.cjs
          node product-2028-integration-47-upgraded/build.cjs
          node product-2028-mobile-ux-v2/build.cjs
          node product-2028-mobile-reading-v3/build.cjs
          node product-2028-reading-v4/build.cjs
          node product-2028-diagnostic-v5/build.cjs
          node product-2028-screening-48/build.cjs
          node product-2028-radiation-49/build.cjs
      - name: Verify all previous 47-course source QA contracts still hold
        run: node --test product-2028-assurance-v1/test.cjs
      - name: Verify new PET/SPECT lesson content and independent four-number calculations
        run: node --test product-2028-nuclear-imaging-foundation/test.cjs
      - name: Build nonproduction 50-course 560-question candidate
        run: node product-2028-nuclear-50/build.cjs
      - name: Verify physical learning path and saved records on simulated iPhone browsers
        run: node product-2028-nuclear-50/browser.cjs
      - name: Archive mobile synthetic regression evidence without formal release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear50-v8-synthetic-proof
          path: |
            product-2028-nuclear-50/build-receipt.json
            product-2028-nuclear-50/browser-results.json
          if-no-files-found: warn
          retention-days: 14
