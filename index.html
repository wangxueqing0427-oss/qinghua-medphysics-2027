<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>清华医学物理 2027</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:#f5f5f7;color:#111827}
*{box-sizing:border-box} body{margin:0;background:#f5f5f7}
header{padding:22px 18px 14px;background:#111827;color:white;position:sticky;top:0;z-index:5}
h1{font-size:24px;margin:0 0 6px}.sub{opacity:.78;font-size:13px}
main{max-width:760px;margin:auto;padding:14px 14px 100px}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}
.days{font-size:30px;font-weight:800}.muted{color:#6b7280;font-size:13px}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#111827;width:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee}.task:last-child{border-bottom:0}
input[type=checkbox]{width:22px;height:22px;margin-top:2px}.task b{display:block}.tag{display:inline-block;font-size:11px;padding:3px 7px;border-radius:8px;background:#eef2ff;margin:5px 5px 0 0}
button{border:0;border-radius:12px;padding:10px 13px;background:#111827;color:white;font-size:14px}button.secondary{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid button{min-height:54px}
textarea,input[type=text]{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;font:inherit}
.small{font-size:12px}.done{text-decoration:line-through;color:#9ca3af}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid #ddd;display:flex;justify-content:center;gap:8px;padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));z-index:10}
nav button{flex:1;max-width:180px}.danger{background:#7f1d1d}
</style>
</head>
<body>
<header>
  <h1>🎓 清华医学物理 2027</h1>
  <div class="sub">英语一 · 政治 · 353卫生综合｜你的私人备考控制台</div>
</header>
<main>
  <section class="card hero">
    <div><div class="muted">距离预计初试（2026-12-19，仅作倒计时参考）</div><div class="days" id="days">—</div><div class="muted">天</div></div>
    <button onclick="resetToday()">今日重置</button>
  </section>

  <section class="card">
    <div class="hero"><div><b>今天的任务</b><div class="muted" id="date"></div></div><div class="muted" id="percent">0%</div></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="tasks"></div>
  </section>

  <section class="card">
    <b>⚡ 选择今天的状态</b>
    <p class="muted">系统会给你一个适合当前时间的学习模式。</p>
    <div class="grid">
      <button onclick="mode('normal')">正常 1–2小时</button>
      <button onclick="mode('busy')">忙碌 40分钟</button>
      <button onclick="mode('trip')">出差 30分钟</button>
      <button onclick="mode('dinner')">饭局后 20分钟</button>
    </div>
  </section>

  <section class="card">
    <b>🧠 今日AI抽背入口</b>
    <p class="muted">把下面内容复制给ChatGPT即可开始抽背。等你上传353真题后，我会把这里升级成真题驱动。</p>
    <textarea id="prompt" rows="5">你是我的清华大学医学物理与健康2027考研教练。今天请只考我5道353卫生综合题，范围：流行病学绪论、疾病分布、发病率/患病率/病死率、描述性研究。先一题一题问我，不要直接给答案；我回答后判断对错，指出遗漏，并安排需要复习的知识点。</textarea>
    <button onclick="copyPrompt()">复制给ChatGPT</button>
  </section>

  <section class="card">
    <b>➕ 临时任务</b>
    <p class="muted">出差、临时加班时，随手加一条，不破坏主计划。</p>
    <input id="newTask" type="text" placeholder="例如：复习病例对照OR 15分钟">
    <button style="margin-top:8px" onclick="addTask()">加入今日任务</button>
  </section>

  <section class="card">
    <b>📊 当前阶段</b>
    <div class="task"><div>🔴</div><div><b>353 主线</b><span class="small">9月：流行病学 → 统计 → 医学物理基础</span></div></div>
    <div class="task"><div>🟠</div><div><b>英语一</b><span class="small">每天1篇阅读，重在真题精读</span></div></div>
    <div class="task"><div>🟡</div><div><b>政治</b><span class="small">9月低强度，10月逐步增加</span></div></div>
  </section>
</main>
<nav>
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">今日</button>
  <button class="secondary" onclick="openLibrary()">📚 353资料库</button>
  <button class="secondary" onclick="copyPrompt()">AI抽背</button>
  <button class="secondary" onclick="alert('真题库暂保持原入口，等你拿到学长真题后再接入。')">真题库</button>
</nav>
<div id="libraryModal" style="display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto">
  <div style="position:sticky;top:0;background:#111827;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:2">
    <b>📚 353 精华资料库</b><button onclick="closeLibrary()" style="background:#fff;color:#111827;border:0;border-radius:10px;padding:7px 12px">返回主APP</button>
  </div>
  <div style="padding:10px;display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:58px;background:#fff;z-index:2;border-bottom:1px solid #eee">
    <button onclick="showLibrary('epi')">流行病学</button>
    <button class="secondary" onclick="showLibrary('stats')">卫生统计</button>
    <button class="secondary" onclick="showLibrary('public_health')">公共卫生</button>
    <button class="secondary" onclick="showLibrary('medical_physics')">医学物理</button>
  </div>
  <iframe id="libraryFrame" src="epi.html" style="width:100%;height:calc(100vh - 116px);border:0"></iframe>
</div>
<script>
function openLibrary(){document.getElementById('libraryModal').style.display='block';document.body.style.overflow='hidden'}
function closeLibrary(){document.getElementById('libraryModal').style.display='none';document.body.style.overflow=''}
function showLibrary(kind){document.getElementById('libraryFrame').src=kind==='stats'?'stats.html':kind==='public_health'?'public_health.html':kind==='medical_physics'?'medical_physics.html':'epi.html'}
const KEY='qinghua2027_tasks_v1';
const baseTasks=[
 {id:'e1',text:'英语一：完成1篇真题阅读并精读错题',tag:'英语',mins:40},
 {id:'e2',text:'流行病学：绪论——定义、研究对象、主要用途',tag:'353',mins:35},
 {id:'e3',text:'卫生统计：数据类型与描述统计基础',tag:'353',mins:30},
 {id:'e4',text:'医学物理：X射线、γ射线、电子束基本概念',tag:'353',mins:25},
 {id:'e5',text:'闭书回忆：写出今天5个必须记住的知识点',tag:'复习',mins:10}
];
function load(){let d=localStorage.getItem(KEY);return d?JSON.parse(d):baseTasks}
function save(t){localStorage.setItem(KEY,JSON.stringify(t))}
function render(){
 let t=load(); let box=document.getElementById('tasks'); box.innerHTML='';
 t.forEach(x=>{let div=document.createElement('div');div.className='task';div.innerHTML=`<input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}')"><div class="${x.done?'done':''}"><b>${x.text}</b><span class="tag">${x.tag}</span><span class="tag">${x.mins}分钟</span></div>`;box.appendChild(div)});
 let n=t.length,done=t.filter(x=>x.done).length,p=n?Math.round(done/n*100):0;document.getElementById('percent').textContent=p+'%';document.getElementById('bar').style.width=p+'%';
}
function toggle(id){let t=load();let x=t.find(a=>a.id===id);x.done=!x.done;save(t);render()}
function addTask(){let v=document.getElementById('newTask').value.trim();if(!v)return;let t=load();t.push({id:'x'+Date.now(),text:v,tag:'临时',mins:15,done:false});save(t);document.getElementById('newTask').value='';render()}
function resetToday(){if(confirm('只重置今天的打卡，不删除任务？')){let t=load().map(x=>({...x,done:false}));save(t);render()}}
function copyPrompt(){navigator.clipboard?.writeText(document.getElementById('prompt').value);alert('已复制。打开ChatGPT，粘贴后开始抽背。')}
function mode(m){
 let all=load();let ids=m==='normal'?['e1','e2','e3','e4','e5']:m==='busy'?['e1','e2']:m==='trip'?['e1','e2']:['e2','e5'];
 all=all.map(x=>({...x,done:ids.includes(x.id)?x.done:true}));save(all);render();
 alert(m==='normal'?'已切换到正常模式。':m==='busy'?'已切换到40分钟模式：英语+353。':m==='trip'?'已切换到出差模式：英语+353核心复习。':'已切换到饭局后模式：只做轻量复习。');
}
function countdown(){let d=new Date('2026-12-19T09:00:00');let n=Math.max(0,Math.ceil((d-new Date())/86400000));document.getElementById('days').textContent=n}
document.getElementById('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
countdown();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
